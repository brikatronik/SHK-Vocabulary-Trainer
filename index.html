<!DOCTYPE html>
<html>
<head>
    <title>SHK Vocabulary Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <h1 id="question">
            Wird geladen...
        </h1>

        <div id="answer" class="hidden">
            <h2 id="germanWord"></h2>
            <img
                id="pageImage"
                class="hidden"
                alt="SHK page image">
            <p id="description"></p>
        </div>

    <div class="bottom-section">

        <!-- Hamburger button -->
        <div id="menuContainer">

            <button id="menuButton">
                ☰
            </button>

        </div>

        <!-- Answer button -->
        <div id="mainButtons">

            <button id="showButton">
                Antwort anzeigen
            </button>

        </div>

        <!-- Voting buttons -->
        <div class="rating-buttons hidden">

            <button id="easyButton">
                Kenne ich
            </button>

            <button id="hardButton">
                Fast
            </button>

            <button id="againButton">
                Keine Ahnung
            </button>

        </div>

        <!-- Counters -->
        <div id="stats">

            <p>
                Bekannt:
                <span id="easyCount">0</span>
            </p>

            <p>
                Fast:
                <span id="hardCount">0</span>
            </p>

            <p>
                Keine Ahnung:
                <span id="againCount">0</span>
            </p>

        </div>

        <div id="sessionContainer">

            <p>
                Heutige Sitzung:
                <span id="sessionCount">
                    0
                </span>
                Karten studiert
            </p>

            <div id="progressBarOuter">
                <div id="progressBarInner"></div>
            </div>

        </div>

    </div>

    </div>

        <!-- Popup overlay -->    
    <div id="overlay" class="hidden">

    <div id="popupMenu">

        <button id="languageOption">
            Sprache wählen
        </button>

        <button id="searchOption" disabled>
            Wort suchen
        </button>

    </div>

    </div>

    <div id="languageModal" class="hidden">

        <div id="languageBox">

            <h2>
                Sprache wählen
            </h2>

            <label>
                Ausgangssprache
            </label>

            <select id="hintLanguage">

                <option value="french">
                    Französisch
                </option>

                <option value="german">
                    Deutsch
                </option>

                <option value="english">
                    Englisch
                </option>

            </select>

            <label>
                Übersetzung Sprache
            </label>

            <select id="guessLanguage">

                <option value="french">
                    Französisch
                </option>

                <option value="german">
                    Deutsch
                </option>

                <option value="english">
                    Englisch
                </option>

            </select>

            <div class="modalButtons">

                <button id="cancelLanguage">
                    Abbrechen
                </button>

                <button id="confirmLanguage">
                    Bestätigen
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
